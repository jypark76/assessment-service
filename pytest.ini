# In plain English: settings for the test runner. "pythonpath = ." lets the
# tests find the app folder, and "testpaths" tells it where the tests live.
[pytest]
pythonpath = .
testpaths = tests
# In plain English: 'owasp' marks which tests prove which OWASP weaknesses. --strict-markers
# makes a misspelled marker an error instead of being ignored.
addopts = --strict-markers
markers =
    owasp(category, *cwe_numbers): the test helps prove these CWEs of this OWASP Top 10:2025 category are stopped
# In plain English: a deprecation warning raised from OUR code (the app package) fails the tests, so the
# build goes red the day our code first uses something that is being retired. Warnings blamed on other
# people's libraries are left alone because we cannot fix them. (tests/test_deprecation_guard.py proves it.)
filterwarnings =
    error::DeprecationWarning:app(\..*)?$
    error::PendingDeprecationWarning:app(\..*)?$
