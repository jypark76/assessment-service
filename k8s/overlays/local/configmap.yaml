# In plain English: the service's NON-secret settings, kept in one place. The
# password is not here; it comes from the Secret (see deployment.yaml). To move
# to AWS, change DB_HOST to the RDS address and nothing else.
apiVersion: v1
kind: ConfigMap
metadata:
  name: assessment-service-config
  namespace: assessment
data:
  # The internal address of the database inside the cluster.
  DB_HOST: assessment-db
  DB_PORT: "5432"
  DB_NAME: assessment
  # The limited login that can only read and add examples.
  DB_USER: assessment_app
