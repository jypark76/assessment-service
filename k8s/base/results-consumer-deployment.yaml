# In plain English: the Kafka results consumer. It runs the SAME image as the assessment service but
# starts a different program (python -m app.results_consumer) that takes grades back from the
# grader off the "grading-results" topic and records them. It is its own Deployment so a Kafka
# problem can never affect the web service. It listens on no port, so it has no probes and no
# Service; if it crashes, Kubernetes restarts it and the message that was in hand is read again (a
# message is only marked done after it is dealt with). One copy runs for now; more can be added
# later and share the topic's lanes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: assessment-results-consumer
  namespace: assessment
  labels:
    # Rolled out AFTER the database changes, like the service, so a new sender never
    # starts on an old table.
    deploy-phase: service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: assessment-results-consumer
  template:
    metadata:
      labels:
        app: assessment-results-consumer
    spec:
      # No Kubernetes API token: this pod never talks to the Kubernetes API, and a stolen token would be a
      # free key to it.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        # Lets the user above read the mounted Secret files.
        fsGroup: 1000
        # The container runtime's default filter blocks dozens of rarely used system calls.
        seccompProfile:
          type: RuntimeDefault
      volumes:
        # A small, size-limited scratch folder, because the root filesystem is read-only.
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: db-password
          secret:
            secretName: assessment-db
            defaultMode: 0440
            items:
              - key: app-password
                path: app-password
      containers:
        - name: assessment-results-consumer
          # Same image name as the service; each overlay adds the version tag.
          image: assessment-service
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: db-password
              mountPath: /etc/secrets/db
              readOnly: true
          command: ["python", "-m", "app.results_consumer"]
          envFrom:
            - configMapRef:
                name: assessment-service-config
          env:
            # DB_PASSWORD is read from a file that Kubernetes mounts from the Secret (see app/secret_files.py),
            # not passed as an environment variable.
            - name: DB_PASSWORD_FILE
              value: /etc/secrets/db/app-password
          securityContext:
            allowPrivilegeEscalation: false
            # Nothing in the image can be changed while it runs. Anything that must be written goes in /tmp.
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
