# In plain English: gives the service a fixed internal address,
# "assessment-service:8000", that other things inside the cluster can use. It has
# no outside port, so nothing outside the cluster can reach it directly.
apiVersion: v1
kind: Service
metadata:
  name: assessment-service
  namespace: assessment
spec:
  selector:
    app: assessment-service
  ports:
    - port: 8000
      targetPort: 8000
