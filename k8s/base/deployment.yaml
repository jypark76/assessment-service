# In plain English: tells the cluster to run one copy of the assessment service
# and to keep it running. If it crashes, Kubernetes starts a new one.
# This is the shared "base": it is the same in every environment. The settings
# that differ (the database address, the image version) live in the overlays.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: assessment-service
  namespace: assessment
  labels:
    # This label lets the deploy script roll the service out AFTER the database
    # changes are done. It is on the Deployments that use the tables only.
    deploy-phase: service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: assessment-service
  template:
    metadata:
      labels:
        app: assessment-service
    spec:
      # Safety rules for the pod: never run as the all-powerful root user.
      # 1000 is the number of "appuser" inside our image.
      # No Kubernetes API token: this pod never talks to the Kubernetes API, and a stolen token would be a
      # free key to it.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        # Lets the user above read the mounted Secret files.
        fsGroup: 1000
        # The container runtime's default filter blocks dozens of rarely used system calls.
        seccompProfile:
          type: RuntimeDefault
      volumes:
        # A small, size-limited scratch folder, because the root filesystem is read-only.
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: db-password
          secret:
            secretName: assessment-db
            defaultMode: 0440
            items:
              - key: app-password
                path: app-password
        - name: service-key
          secret:
            secretName: assessment-service-key
            defaultMode: 0440
            items:
              - key: keys
                path: keys
      containers:
        - name: assessment-service
          # The image NAME only. The version tag is added by each overlay (see
          # the "images" part of its kustomization.yaml), never "latest":
          # Kubernetes tries to download "latest" images, and the local one only
          # exists on this laptop. On AWS the overlay swaps in the ECR address.
          image: assessment-service
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: db-password
              mountPath: /etc/secrets/db
              readOnly: true
            - name: service-key
              mountPath: /etc/secrets/service-key
              readOnly: true
          # Use the local copy if there is one; do not try to download.
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          # Load the non-secret settings (DB_HOST and friends) from the
          # ConfigMap, which each overlay supplies under this same name.
          envFrom:
            - configMapRef:
                name: assessment-service-config
          env:
            # DB_PASSWORD is read from a file that Kubernetes mounts from the Secret (see app/secret_files.py),
            # not passed as an environment variable.
            - name: DB_PASSWORD_FILE
              value: /etc/secrets/db/app-password
            # SERVICE_KEYS is read from a file that Kubernetes mounts from the Secret (see app/secret_files.py),
            # not passed as an environment variable.
            - name: SERVICE_KEYS_FILE
              value: /etc/secrets/service-key/keys
          # "Are you alive?" If this keeps failing, Kubernetes restarts the pod.
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          # "Are you ready for work?" Traffic is only sent once this passes,
          # which also means the database login worked.
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          # Extra lockdown: no privilege tricks, and every special Linux power
          # taken away.
          securityContext:
            allowPrivilegeEscalation: false
            # Nothing in the image can be changed while it runs. Anything that must be written goes in /tmp.
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # A small service with no AI model, so it needs little memory.
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 256Mi
