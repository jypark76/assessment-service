# In plain English: this tells GitHub to run the automated tests every time
# someone opens or updates a pull request, and every time something lands on
# main. If any test fails, the check turns red. Once the branch rules on GitHub
# require this check ("tests"), a red check blocks the merge.
name: tests

on:
  pull_request:
  push:
    branches: [main]

# The workflow only needs to read the code, nothing more.
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      # Where the AI model files are saved, so they can be reused between runs.
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.model_cache
    steps:
      - uses: actions/checkout@v4

      # Same Python version as the Dockerfile, so tests match the real service.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # Remember the downloaded AI model so most runs skip the 130 MB download.
      - uses: actions/cache@v4
        with:
          path: .model_cache
          key: fastembed-bge-small-en-v1.5

      - run: pip install -r requirements-dev.txt

      # The Kubernetes file checks run in their own job below, so skip them here.
      - run: pytest -v --ignore=tests/test_k8s_manifests.py

  # In plain English: the second job. It starts a real, throwaway Postgres in a
  # container, builds it the same way the cluster does (the same db/init.sql and
  # the same password script), then runs the database tests against it. The
  # passwords are random, made fresh for each run, hidden from the logs and never
  # stored anywhere. When the job ends, the database and its data are destroyed.
  database-tests:
    runs-on: ubuntu-latest
    env:
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.model_cache
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - uses: actions/cache@v4
        with:
          path: .model_cache
          key: fastembed-bge-small-en-v1.5

      # Make two random passwords for this run only, hide them from the logs, and
      # hand them to the later steps.
      - name: Make throwaway passwords
        run: |
          admin_password="$(openssl rand -hex 16)"
          app_password="$(openssl rand -hex 16)"
          echo "::add-mask::$admin_password"
          echo "::add-mask::$app_password"
          echo "ADMIN_PASSWORD=$admin_password" >> "$GITHUB_ENV"
          echo "APP_PASSWORD=$app_password" >> "$GITHUB_ENV"

      # Start Postgres the way the cluster does: the two first-start scripts are
      # put in the folder Postgres reads when it creates a new database. The
      # database is named knowledge_test, which is the only name the tests accept.
      - name: Start the test database
        run: |
          chmod +x k8s/overlays/local/set-app-password.sh
          docker run -d --name test-db \
            -e POSTGRES_PASSWORD="$ADMIN_PASSWORD" \
            -e POSTGRES_DB=knowledge_test \
            -e APP_PASSWORD="$APP_PASSWORD" \
            -v "$PWD/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro" \
            -v "$PWD/k8s/overlays/local/set-app-password.sh:/docker-entrypoint-initdb.d/02-set-app-password.sh:ro" \
            -p 5432:5432 \
            pgvector/pgvector:0.8.7-pg17

      # Wait until the first-start scripts have finished AND the real server is
      # answering over the network. (A check over the local socket can say "ready"
      # too early, while the temporary setup server is still running.)
      - name: Wait for the database
        run: |
          for attempt in $(seq 1 60); do
            if docker logs test-db 2>&1 | grep -q "init process complete" \
              && docker exec test-db pg_isready -h 127.0.0.1 -U postgres -d knowledge_test; then
              exit 0
            fi
            sleep 2
          done
          echo "The test database did not become ready in time." >&2
          docker logs test-db >&2
          exit 1

      - run: pip install -r requirements-dev.txt

      # REQUIRE_DB=1 turns "skipped" into "failed", so these tests cannot pass by
      # silently doing nothing.
      - name: Run the database tests
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: knowledge_test
          DB_USER: knowledge_app
          DB_PASSWORD: ${{ env.APP_PASSWORD }}
          REQUIRE_DB: "1"
        run: pytest -v tests/test_database.py

      # If anything failed, show the database's own log to help find out why.
      - name: Show the database log
        if: failure()
        run: docker logs test-db

  # In plain English: the third job. It checks the Kubernetes files before they
  # ever reach a cluster: the two shell scripts are checked with shellcheck, and
  # the final laptop files are built and checked against our rules (right
  # namespace, no Secret, fixed image tags, locked-down service pod and so on).
  # REQUIRE_KUBECTL=1 makes a missing kubectl a failure and not a quiet skip.
  kubernetes-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Check the shell scripts
        run: shellcheck k8s/deploy.sh k8s/overlays/local/set-app-password.sh

      - name: Check the rendered Kubernetes files
        env:
          REQUIRE_KUBECTL: "1"
        run: pytest -v tests/test_k8s_manifests.py

  # In plain English: the fourth job. It builds the real Docker image, the same one
  # the cluster runs, and starts it with the network switched off and no database.
  # Then it checks the things the other jobs take on trust: the service answers
  # /health, /ready fails safely, the AI model is really inside the image (it cannot
  # download anything with the network off), the service runs as user 1000 and not
  # as root, and nothing that should stay out of the image got in.
  image-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t knowledge-service:ci .

      # --network none means the container cannot reach the internet. If the model
      # was not saved into the image during the build, the model check below fails.
      - name: Start it with the network off
        run: docker run -d --name image-test --network none knowledge-service:ci

      - name: Wait for the service to answer
        run: |
          for attempt in $(seq 1 30); do
            if docker exec image-test python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"; then
              exit 0
            fi
            sleep 1
          done
          echo "The service did not start in time." >&2
          docker logs image-test >&2
          exit 1

      - name: Check /health
        run: |
          reply="$(docker exec image-test python -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8000/health').read().decode())")"
          if [ "$reply" != '{"ok":true}' ]; then
            echo "Unexpected /health reply: $reply" >&2
            exit 1
          fi

      # With no database settings the ready check must answer 503 and say nothing
      # about why.
      - name: Check /ready fails safely with no database
        run: |
          docker exec -i image-test python - <<'PY'
          import json
          import urllib.error
          import urllib.request

          try:
              urllib.request.urlopen("http://127.0.0.1:8000/ready", timeout=5)
          except urllib.error.HTTPError as error:
              assert error.code == 503, error.code
              assert json.loads(error.read()) == {"ok": False}
          else:
              raise SystemExit("expected a 503 from /ready")
          PY

      - name: Check the model is inside the image
        run: |
          docker exec image-test python -c "from app.embeddings import embed_text; numbers = embed_text('hello world'); assert len(numbers) == 384, len(numbers)"

      - name: Check it runs as user 1000
        run: |
          user_id="$(docker exec image-test id -u)"
          if [ "$user_id" != "1000" ]; then
            echo "The service runs as user $user_id, expected 1000" >&2
            exit 1
          fi

      # Only the code, the model and the list of libraries (the Dockerfile copies it in
      # to install them) should be in /app. The tests, the Kubernetes files and any
      # notes must stay out, and so must anything that looks like a secret.
      - name: Check only the expected files are inside
        run: |
          contents="$(docker exec image-test ls -A /app | sort | tr '\n' ' ')"
          if [ "$contents" != "app model_cache requirements.txt " ]; then
            echo "Unexpected files in /app: $contents" >&2
            exit 1
          fi
          suspicious="$(docker exec image-test find /app \( -name '.env*' -o -name '*.pem' -o -name '*.key' -o -iname '*secret*' \))"
          if [ -n "$suspicious" ]; then
            echo "Files that look like secrets are inside the image:" >&2
            echo "$suspicious" >&2
            exit 1
          fi

      - name: Show the service log
        if: failure()
        run: docker logs image-test

      - name: Clean up
        if: always()
        run: docker rm -f image-test
